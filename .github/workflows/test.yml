name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: SVG size budget
        run: npm run size
      - name: Render a demo campfire with the CLI
        run: node src/cli.js --demo --streak 23 --out dist/demo.svg
